name: Auto-Improve Blog Posts

on:
  schedule:
    # 08:00 UTC daily — just after Gemini's midnight-PT quota reset
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  improve-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: ./scripts

      - name: Run Blog Post Improvement Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GATSBY_CONTENTFUL_SPACE_ID: ${{ secrets.GATSBY_CONTENTFUL_SPACE_ID }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          CONTENTFUL_ENVIRONMENT_ID: master
        run: node 2-improve-blogposts.js
        working-directory: ./scripts